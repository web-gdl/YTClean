# Compila la app Android nativa de YT Clean (Kotlin + NewPipeExtractor + Media3) y la publica como artefacto y como
# Release del repositorio para descargarlo desde el teléfono.
name: APK Android

on:
  push:
    branches: [main]
    # Los cambios solo de documentación o de flujos no generan un APK nuevo
    # (para recompilar sin cambios de código: Actions → APK Android → Run workflow).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/release-notes.yml'
      - 'scripts/release-notes.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      YC_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión
        run: echo "YC_VERSION_NAME=0.8.1-${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.YC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YC_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/ytclean.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"; alias="${KEY_ALIAS:-ytclean}"
            echo "Firma: clave de los secretos del repositorio (actualizaciones sin desinstalar)."
          else
            pass="$(openssl rand -hex 16)"; alias=ytclean
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YT Clean" >/dev/null
            echo "::warning::Sin secreto YC_KEYSTORE_BASE64: APK firmado con una clave temporal. Para instalar una versión nueva habrá que desinstalar la anterior. Ver docs/android.md."
          fi
          echo "::add-mask::$pass"
          {
            echo "YC_KEYSTORE_FILE=$ks"
            echo "YC_KEYSTORE_PASSWORD=$pass"
            echo "YC_KEY_PASSWORD=$pass"
            echo "YC_KEY_ALIAS=$alias"
          } >> "$GITHUB_ENV"
      - name: Compilar APK firmado
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Publica el motivo del fallo como anotación (legible sin descargar el registro).
            msg=$( { grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -40; grep -A 15 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -30; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::${msg}"
          fi
          exit "$code"
      - name: Renombrar
        run: |
          mkdir -p out
          # Nombre fijo: el enlace releases/latest/download/YTClean.apk no cambia entre versiones.
          cp android/app/build/outputs/apk/release/app-release.apk out/YTClean.apk
          echo "::notice title=APK::YTClean ${YC_VERSION_NAME}: $(du -h out/YTClean.apk | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: YTClean-apk
          path: out/*.apk
          retention-days: 30
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${{ github.repository }}" "$GITHUB_SHA" "$(du -h out/YTClean.apk | cut -f1)" > notes.md
          gh release create "apk-${YC_VERSION_NAME}" out/YTClean.apk \
            --title "YT Clean ${YC_VERSION_NAME}" \
            --notes-file notes.md \
            --latest
