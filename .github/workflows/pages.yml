# Publica la compilación en GitHub Pages. Requiere activar Pages en el
# repositorio con origen «GitHub Actions» (Settings → Pages). La aplicación se
# sirve en https://<usuario>.github.io/<repositorio>/ y por eso se compila con
# BASE_PATH=/<repositorio>/.
#
# GitHub Pages no permite cabeceras HTTP propias: la CSP se aplica con la
# etiqueta <meta> y las cabeceras de dist/_headers no tienen efecto aquí.
name: Publicar en GitHub Pages

# Solo manual: en un repositorio privado, GitHub Pages requiere un plan de pago.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run check:connections
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
